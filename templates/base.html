<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sada Portfolio</title>
    {% load static %}

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #111827;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #1f2937;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 22px;
        }

        .sidebar p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .nav-links a {
            display: block;
            text-decoration: none;
            color: #e5e7eb;
            padding: 10px 0;
            transition: 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: #38bdf8;
            padding-left: 5px;
        }

        /* ACTIVE EFFECT IDEA */
        .nav-links a::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 50%;
            width: 5px;
            height: 5px;
            background: #38bdf8;
            border-radius: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: 0.3s;
        }

        .nav-links a:hover::before {
            opacity: 1;
        }

        /* MAIN CONTENT */
        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        /* SECTION STYLING */
        section {
            margin-bottom: 80px;
        }

        h1, h2 {
            margin-bottom: 10px;
        }

        h2 {
            border-left: 4px solid #38bdf8;
            padding-left: 10px;
        }

        /* BUTTON */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        /* CARD (Projects) */
        .card {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* FORM */
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #1f2937;
            color: #fff;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div>
                <h3>Sada</h3>
                <p>Urban Planner | Django Dev</p>
                <nav class="nav-links">
                    <a href="{% url 'home_page' %}">Home</a>
                    <a href="{% url 'home_page' %}#about">About</a>
                    <a href="{% url 'projects_page' %}">Projects</a>
                    <a href="{% url 'home_page' %}#skills">Skills</a>
                    <a href="{% url 'home_page' %}#contact">Contact</a>
                </nav>
            </div>
            <div><p style="font-size: 12px; color: #6b7280;">© 2026 Sada</p></div>
        </aside>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
